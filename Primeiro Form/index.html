<!DOCTYPE html>
<html lang="pt-BR">
   <head>
      <title>BuyMore - Cadastro de comprador Premium</title>
      <meta charset="UTF-8">
   </head>
   <body>
<header>
<h1>Cadastro</h1>
</header>
<main>
    <section>
<h2>Dados de Cadastro</h2>
    <form action="http://postman-echo.com/post" method="post" enctype="multipart/form-data">
<p>Preencha os campos abaixo para se cadastrar no site</p>
<fieldset>
    <legend>Dados</legend>
    <div>
<label for="foto_id">Gift Card de Cadastro Premium:</label>
<input id="foto_id" name="foto" type="file" accept="image/*"> 
</div>
<div>
<label for="nome_id">Nome completo:</label>
<input id="nome_id" name="nome" type="text">
</div>
<div>
<label for="telefone_id">Telefone:</label>
<input id="telefone_id" name="telefone" type="tel">
</div>
<div>
    <label for="email_id">Email:</label>
    <input id="email_id" name="email" type="email">
</div>
<div>
    <label for="data_nasc_id">Data de Nascimento:</label>
    <input id="data_nasc_id" name="data_nasc" type="date">
</div>

<fieldset>
    <legend>Endereço de Entrega</legend>
    <div>
    <label for="logradouro_id">Logradouro:</label>
    <input id="logradouro_id" name="Logradouro" type="text">
    </div>
    <label for="cidade_id">Cidade:</label>
    <input id="cidade_id" name="Cidade" type="text">
    <div>
    </div>
    <label for="numero_id">Número:</label>
    <input id="numero_id" name="Numero" type="number">
    <div>  

    </div>
</fieldset>

<div>
    <button type="reset">Limpar dados</button>
    <button type="submit">Cadastrar</button>
</div>

</form>
    </section>

</main>
<footer>
<p>&copy 2026 BuyMore International Shipping, Todos os direitos reservados.</p>
</footer>
   </body>
</html>
